<div class="hm-scroll">
  <table class="hm">
    <thead>
      <tr>
        <th class="hm-corner"></th>
        @for (c of colLabels; track c) {
          <th class="hm-col" title="{{ c }}">{{ c }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (fila of matriz; track $index; let i = $index) {
        <tr>
          <th class="hm-fila" title="{{ filaLabels[i] }}">{{ filaLabels[i] }}</th>
          @for (v of fila; track $index; let j = $index) {
            <td
              class="hm-celda"
              [style.background]="color(v)"
              [style.color]="texto(v)"
              [title]="filaLabels[i] + ' × ' + colLabels[j] + ': ' + valor(v)">
              {{ valor(v) }}
            </td>
          }
        </tr>
      }
    </tbody>
  </table>
</div>
